version: "3"

tasks:
  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  frontend:install:
    desc: Install React frontend dependencies with Bun
    dir: frontend
    preconditions:
      - sh: bun --version
        msg: Bun is required. Install it from https://bun.sh
      - sh: test -f package.json
        msg: frontend/package.json was not found. Create the React frontend first.
    cmds:
      - bun install

  frontend:dev:
    desc: Start the React development server with Bun
    dir: frontend
    preconditions:
      - sh: bun --version
        msg: Bun is required. Install it from https://bun.sh
      - sh: test -f package.json
        msg: frontend/package.json was not found. Create the React frontend first.
    cmds:
      - bun run dev

  frontend:typecheck:
    desc: Type-check the React frontend
    dir: frontend
    preconditions:
      - sh: bun --version
        msg: Bun is required. Install it from https://bun.sh
      - sh: test -f package.json
        msg: frontend/package.json was not found.
    cmds:
      - bun run typecheck

  frontend:build:
    desc: Build the React frontend into frontend/dist
    dir: frontend
    preconditions:
      - sh: bun --version
        msg: Bun is required. Install it from https://bun.sh
      - sh: test -f package.json
        msg: frontend/package.json was not found. Create the React frontend first.
    cmds:
      - bun run build

  build-gui:
    desc: Build the React frontend and Wails desktop application
    cmds:
      - go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 build

  dev-gui:
    desc: Run Wails with the Bun-powered React development server
    cmds:
      - go run github.com/wailsapp/wails/v2/cmd/wails@v2.12.0 dev

  build-cli:
    desc: Build the command-line application
    cmds:
      - go build -o dist/typemerge ./cmd/typemerge

  run:
    desc: Run the command-line application
    cmds:
      - go run ./cmd/typemerge -formats ""

  fmt:
    desc: Format Go source files
    cmds:
      - gofmt -w cmd internal pkg
